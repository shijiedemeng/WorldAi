[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-api-python-client"
version = "0.1.0"
description = "Python execution client for the local ai-api backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ai-api-agent-scheduler = "ai_api_client.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_api_client*"]
